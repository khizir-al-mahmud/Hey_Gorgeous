<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Swarna | My Forever</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://banglawebfonts.pages.dev/css/mukti.css" rel="stylesheet">

    <style>
        :root {
            --rose-pink: #ff4d6d;
            --deep-purple: #2d0b3b;
            --gold: #ffb703;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #1a1a2e, #4a0e2e, #0f3460, #16213e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Pulse animation for the gift heart */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .heart-particle {
            position: absolute;
            color: var(--rose-pink);
            pointer-events: none;
            animation: floatUp var(--d) linear infinite;
            opacity: 0;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-card {
            background: var(--glass);
            padding: 3rem;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 77, 109, 0.2);
            max-width: 400px;
            width: 90%;
        }

        .login-card h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ff4d6d, #ffb703);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 50px;
            color: white;
            width: 100%;
            outline: none;
            text-align: center;
            font-size: 1.1rem;
            margin: 20px 0;
        }

        #main-content {
            width: 95%;
            max-width: 900px;
            height: 85vh;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }

        .nav-item {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.3s;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .nav-item.active {
            opacity: 1;
            background: var(--rose-pink);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.5);
        }

        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--rose-pink) transparent;
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background-color: var(--rose-pink);
            border-radius: 10px;
        }

        .tab-panel { 
            display: none; 
            width: 100%; 
            min-height: 100%; 
            animation: slideIn 0.6s ease; 
        }

        .tab-panel.active { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
        }

        /* Special class for gallery – aligns content to top so scrolling works */
        .tab-panel.gallery-active {
            justify-content: flex-start !important;
            padding-top: 20px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .big-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--gold);
            text-align: center;
            margin-bottom: 20px;
        }

        #typing-text, #reasonText {
            line-height: 1.8;
            font-size: 1.2rem;
            white-space: pre-line;
        }

        #reasonText {
            font-family: 'Mukti', sans-serif;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .gallery-grid {
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px;
            padding-bottom: 30px;
        }

        .memory-card {
            background: white;
            padding: 10px;
            padding-bottom: 35px;
            transform: rotate(calc(var(--r) * 1deg));
            transition: 0.4s;
            width: 220px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .memory-card:hover {
            transform: scale(1.1) rotate(0deg);
            z-index: 100;
        }

        .memory-card img { width: 100%; height: 180px; object-fit: cover; }

        .btn-special {
            background: linear-gradient(45deg, #ff4d6d, #ff8fa3);
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-special:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3); }

        @media (max-width: 600px) {
            .big-text { font-size: 2.5rem; }
            .nav-item { padding: 8px 12px; font-size: 0.7rem; }
            .memory-card { width: 160px; }
            .memory-card img { height: 140px; }
        }
    </style>
</head>
<body>

    <div id="heart-bg"></div>

    <div id="login-overlay">
        <div class="login-card">
            <h1>Hey Gorgeous</h1>
            <p>Enter passcode to enter...</p>
            <input type="password" id="passkey" placeholder="Passcode: Swarna">
            <button class="btn-special" onclick="unlock()">Unlock</button>
            <p id="error" style="color: var(--rose-pink); margin-top: 15px; display: none;">That's not it, my love! Try again.</p>
        </div>
    </div>

    <div id="main-content">
        <div class="nav-bar">
            <div class="nav-item active" onclick="showTab(0)">Letter</div>
            <div class="nav-item" onclick="showTab(1)">Gallery</div>
            <div class="nav-item" onclick="showTab(2)">Why You?</div>
            <div class="nav-item" onclick="showTab(3)">Gift</div>
        </div>

        <div class="content-area">

            <div class="tab-panel active">
                <h2 class="big-text">Dear Swarna,</h2>
                <div id="typing-text"></div>
            </div>

            <!-- Removed initial gallery-active class for cleanliness -->
            <div class="tab-panel">
                <div class="gallery-grid">
                    <div class="memory-card" style="--r: -5">
                        <img src="https://pbs.twimg.com/media/HBITsIBakAEWNOv?format=jpg&name=large" alt="Love">
                    </div>
                    <div class="memory-card" style="--r: 3">
                        <img src="https://pbs.twimg.com/media/HBIfX-BbIAAzb7N?format=jpg&name=large" alt="Together">
                    </div>
                    <div class="memory-card" style="--r: -5">
                        <img src="https://pbs.twimg.com/media/HBIgK_takAMILgd?format=jpg&name=large" alt="Together">
                    </div>
                    <div class="memory-card" style="--r: -5">
                        <img src="https://pbs.twimg.com/media/HBIgiPbakAMpH6e?format=png&name=small" alt="Love">
                    </div>
                    <div class="memory-card" style="--r: 3">
                        <img src="https://pbs.twimg.com/media/HBIfyS9bIAANMCF?format=jpg&name=large" alt="Together">
                    </div>
                    <div class="memory-card" style="--r: -5">
                        <img src="https://pbs.twimg.com/media/HBIg7GiboAAq1VY?format=jpg&name=large" alt="Together">
                    </div>
                </div>
                <p style="text-align:center; margin-top: 20px; padding-bottom: 20px;">....</p>
            </div>

            <div class="tab-panel">
                <div id="reasonText"></div>
                <div id="triggerBtnArea" style="text-align: center; margin-top: 30px;">
                    <button class="btn-special" id="startReasonBtn" onclick="startReasonTyping()">Click</button>
                </div>
            </div>

            <div class="tab-panel" style="text-align: center;">
                <h2 class="big-text">Happy Valentine's Day!</h2>
                <p style="font-size: 1.2rem; margin-bottom: 30px;">I made this because you deserve something as unique as you are.</p>
                <!-- Now pulse animation works -->
                <div style="font-size: 5rem; animation: pulse 1.5s infinite;">💝</div>
            </div>
        </div>
    </div>

    <script>
        // Floating hearts
        const heartContainer = document.getElementById('heart-bg');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.setProperty('--d', (Math.random() * 5 + 3) + 's');
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heartContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 8000);
        }
        setInterval(createHeart, 300);

        // Unlock logic
        function unlock() {
            const pass = document.getElementById('passkey').value.toLowerCase();
            if(pass === 'swarna') {
                document.getElementById('login-overlay').style.transform = 'translateY(-100%)';
                document.getElementById('main-content').style.display = 'flex';
                setTimeout(startLetterTyping, 1000);
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        // Tab system
        const panels = document.querySelectorAll('.tab-panel');
        const navItems = document.querySelectorAll('.nav-item');

        function showTab(index) {
            panels.forEach(p => {
                p.classList.remove('active');
                p.classList.remove('gallery-active');
            });
            navItems.forEach(n => n.classList.remove('active'));

            panels[index].classList.add('active');
            if(index === 1) {
                panels[index].classList.add('gallery-active');
            }
            navItems[index].classList.add('active');
        }

        // Typing effect for Letter
        const letter = "You are the melody to my favorite song and the peace in my chaotic world. \n\nBuilding this for you is just a small way to say that you mean everything to me. Thank you for being you, Swarna. \n\nForever yours.";
        let i = 0;
        function startLetterTyping() {
            if (i < letter.length) {
                document.getElementById("typing-text").innerHTML += letter.charAt(i);
                i++;
                setTimeout(startLetterTyping, 40);
            }
        }

        // Why You? section
        const heartText = `I don’t need any reason to love you — 
I just love you...

I never want to hold you for some reason...
কারণগুলো তো খুব দ্রুত ফুরিয়ে যায়।

Love you, always...`;

        let j = 0;
        let isTyping = false;

        function startReasonTyping() {
            if(isTyping) return;
            isTyping = true;
            document.getElementById('startReasonBtn').style.display = 'none';
            typeReason();
        }

        function typeReason() {
            if (j < heartText.length) {
                document.getElementById("reasonText").innerHTML += heartText.charAt(j);
                j++;
                let speed = heartText.charAt(j-1) === '\n' ? 400 : 40; 
                setTimeout(typeReason, speed);
            }
        }
    </script>
</body>
</html>
